name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent_relay
          POSTGRES_PASSWORD: agent_relay
          POSTGRES_DB: agent_relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_relay -d agent_relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RELAY_DATABASE_URL: postgresql+psycopg://agent_relay:agent_relay@localhost:5432/agent_relay
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests against PostgreSQL
        run: uv run pytest -q

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        run: echo "IMAGE_TAG=agent-relay:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build -t "$IMAGE_TAG" .

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: agent-relay-ci
          wait: 60s

      - name: Load image into kind
        run: kind load docker-image "$IMAGE_TAG" --name agent-relay-ci

      - name: Deploy PostgreSQL
        run: kubectl apply -f k8s/postgres.yaml

      - name: Wait for PostgreSQL
        run: kubectl wait --for=condition=ready pod -l app=postgres --timeout=120s

      - name: Deploy agent-relay at this commit's image
        run: |
          sed "s|image: agent-relay:local|image: $IMAGE_TAG|" k8s/agent-relay.yaml | kubectl apply -f -

      - name: Confirm the rollout completes
        run: kubectl rollout status deployment/agent-relay --timeout=120s

      - name: Smoke test the deployed app
        run: |
          kubectl port-forward svc/agent-relay 8000:8000 &
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:8000/ready && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/ready
          curl -sf http://127.0.0.1:8000/ | grep -q "Agent Relay v2"
